<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Breeds</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="hero">
            <img src="landing.png" alt="Hero Banner" class="hero-image">
            <h1>Discover Dog Breeds</h1>
        </div>
    </header>

    <main>
        <div class="breed-selector">
            <h2>Select a Breed</h2>
            <div class="breed-buttons">
                <button class="breed-btn" data-breed="pitbull" data-image="pitbull.jpg">Pitbull</button>
                <button class="breed-btn" data-breed="labrador" data-image="labrador.jpg">Labrador</button>
                <button class="breed-btn" data-breed="beagle" data-image="beagle.jpg">Beagle</button>
            </div>
        </div>

        <div class="breed-display">
            <div class="breed-info" id="pitbull">
                <img src="pitbull.jpg" alt="Pitbull" class="breed-image">
                <h3>Pitbull</h3>
                <p>Strong, loyal, and affectionate companion.</p>
            </div>
            <div class="breed-info" id="labrador">
                <img src="labrador.jpg" alt="Labrador" class="breed-image">
                <h3>Labrador</h3>
                <p>Friendly, outgoing, and high-spirited companion.</p>
            </div>
            <div class="breed-info" id="beagle">
                <img src="beagle.jpg" alt="Beagle" class="breed-image">
                <h3>Beagle</h3>
                <p>Curious, clever, and merry companion.</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Dog Breeds. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
